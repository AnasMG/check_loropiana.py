name: availability-monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python check_loropiana.py "$(cat products.txt)" --sizes 38,39.5 | tee status.txt
      - name: commit results
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add status.txt
          git commit -m "check $(date -u +%H:%M)" || echo "no change"
          git push
